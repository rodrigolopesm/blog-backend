# Nome da aplicação
spring.application.name=blog

# Porta do servidor (padrão é 8080)
server.port=8080

# ========================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ========================================

# URL de conexão do PostgreSQL
# localhost:5432 = onde o banco está rodando
# mydatabase = nome do banco (definido no compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# CONFIGURAÇÃO DO JPA/HIBERNATE
# ========================================

# Dialeto do PostgreSQL (Hibernate usa isso para gerar SQL correto)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar SQLs no console (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# validate = valida se as entidades batem com as tabelas
# NÃO use 'update' ou 'create' - deixe o Flyway gerenciar o schema
spring.jpa.hibernate.ddl-auto=validate

# ========================================
# CONFIGURAÇÃO DO FLYWAY
# ========================================

# Flyway gerencia as migrations automaticamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ========================================
# LOGS (para debug)
# ========================================

# Ver queries SQL executadas
logging.level.org.hibernate.SQL=DEBUG
# Ver parâmetros das queries (?, ?, ?)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
